{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>SafeRoute AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'style.css' %}">>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary">SafeRoute AI</a>
        <div>
            <a href="/" class="nav-link d-inline">Home</a>
            <a href="/login/" class="nav-link d-inline">Login</a>
            <a href="/register/" class="btn btn-gradient ms-2">Sign Up</a>
        </div>
    </div>
</nav>

<!-- Page Content -->
<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

<!-- Footer -->
<footer class="bg-light text-center p-4 mt-5">
    <p>© 2026 SafeRoute AI. All rights reserved.</p>
    <p>
        Police: 100 | Women Helpline: 1091 | Ambulance: 102
    </p>
</footer>

</body>
</html>
